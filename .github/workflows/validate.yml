name: Validate Career Gap Navigator Skill
on:
  push:
  pull_request:
jobs:
  skill-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structure and metadata
        run: python tests/test_skill_structure.py
      - name: Check canonical policy coverage and release baseline
        run: python scripts/check_policy_sync.py
      - name: Screen for publication privacy hazards
        run: python scripts/validate_privacy.py
